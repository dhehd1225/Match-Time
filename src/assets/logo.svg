    <!-- Right wing middle feather -->
    <path d="M10,-58 C14,-48 24,-34 40,-22 C50,-14 58,-10 62,-8 C52,-18 44,-30 38,-40 C32,-50 26,-56 22,-60 C18,-58 14,-57 10,-58 Z" />
